<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gefühlskarten-Rad synchron</title>
</head>
<body>
<h1>Gefühlskarten-Rad (komplett)</h1>

<button id="spin">Rad drehen</button>
<button id="reset">Rad zurücksetzen</button>
<div id="result"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCu3tQqwYq3QNTB-m6wg9iaZfTbrflFbM",
  authDomain: "gefuehl-rad.firebaseapp.com",
  projectId: "gefuehl-rad"
};

const ADMIN_PASSWORD = "meinAdminPasswort123";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const wheelRef = doc(db, "wheelState", "current");

const spinBtn = document.getElementById("spin");
const resetBtn = document.getElementById("reset");
const result = document.getElementById("result");

const ALL_NUMBERS = Array.from({length: 39}, (_, i) => i + 1);
let remaining = [...ALL_NUMBERS];

async function ensureInitialState() {
  const snap = await getDoc(wheelRef);
  if (!snap.exists()) {
    await setDoc(wheelRef, { remaining: ALL_NUMBERS });
  }
}

onSnapshot(wheelRef, (snap) => {
  if (snap.exists()) {
    remaining = snap.data().remaining;
  }
});

async function spin() {
  if (remaining.length === 0) return;
  const index = Math.floor(Math.random() * remaining.length);
  const chosen = remaining[index];
  result.textContent = "Gezogen: " + chosen;

  await runTransaction(db, async (transaction) => {
    const snap = await transaction.get(wheelRef);
    let current = snap.data().remaining;
    current = current.filter(n => n !== chosen);
    transaction.set(wheelRef, { remaining: current });
  });
}

async function resetWheel() {
  const input = prompt("Admin-Kennwort eingeben:");
  if (input !== ADMIN_PASSWORD) {
    alert("Falsches Passwort!");
    return;
  }

  await setDoc(wheelRef, { remaining: ALL_NUMBERS });
  alert("Rad wurde zurückgesetzt!");
}

spinBtn.addEventListener("click", spin);
resetBtn.addEventListener("click", resetWheel);

ensureInitialState();
</script>
</body>
</html>
